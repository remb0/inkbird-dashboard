- title: Settings
  path: settings
  icon: mdi:cog
  type: sections
  max_columns: 3
  header:
    layout: center
    badges_position: bottom
    badges_wrap: wrap
    card:
      type: markdown
      text_only: true
      content: |
        ## Settings
        Model-aware controls and diagnostics. Unsupported entities are omitted by the HACS strategy instead of being shown as unknown.
  sections:
  - type: grid
    cards:
    - type: heading
      heading: Overview
      heading_style: title
      icon: mdi:grill
    - type: entities
      title: null
      show_header_toggle: false
      entities:
      - entity: input_select.inkbird_dashboard_model
        name: Dashboard layout
      - entity: sensor.inkbird_int_14_configured_model
        name: Integration model
      - entity: sensor.inkbird_int_14_physical_probe_count
        name: Physical probes
      - entity: sensor.inkbird_int_14_mapped_live_temperature_channel_count
        name: Live temperature channels
      - entity: sensor.overig_inkbird_int_14_base_temperature
        name: Base temperature
      - entity: sensor.overig_inkbird_int_14_base_battery
        name: Base battery
      - entity: sensor.inkbird_int_14_model_support_status
        name: Model support
  - type: grid
    cards:
    - type: heading
      heading: Connection
      heading_style: title
      icon: mdi:connection
    - type: entities
      title: null
      show_header_toggle: false
      entities:
      - entity: select.inkbird_int_14_transport_mode
        name: Transport mode
      - entity: sensor.inkbird_int_14_active_transport
        name: Active transport
      - entity: binary_sensor.inkbird_int_14_ble_connected
        name: Bluetooth
      - entity: binary_sensor.inkbird_int_14_wi_fi_connected
        name: Wi-Fi
      - entity: sensor.inkbird_int_14_local_lan_available
        name: Local LAN available
      - entity: sensor.inkbird_int_14_last_ble_update_epoch
        name: Last BLE update
      - entity: sensor.inkbird_int_14_last_lan_update_epoch
        name: Last LAN update
    - type: button
      entity: button.inkbird_int_14_request_snapshot
      name: Request fresh snapshot
      icon: mdi:refresh
  - type: grid
    cards:
    - type: heading
      heading: Device controls
      heading_style: title
      icon: mdi:tune-vertical
    - type: conditional
      inkbird_model: int14_bw
      conditions:
      - condition: state
        entity: input_select.inkbird_dashboard_model
        state: INT-14-BW
      card:
        type: entities
        title: INT-14-BW
        show_header_toggle: false
        entities:
        - entity: number.overig_inkbird_int_14_display_light_command
          name: Display brightness
        - entity: binary_sensor.inkbird_int_14_sound_enabled
          name: Station sound
        - entity: binary_sensor.inkbird_int_14_muted
          name: Muted
        - entity: sensor.inkbird_int_14_temperature_unit
          name: Station temperature unit
    - type: conditional
      inkbird_model: int14s_bw
      conditions:
      - condition: state
        entity: input_select.inkbird_dashboard_model
        state: INT-14S-BW
      card:
        type: entities
        title: INT-14S-BW - read-only
        show_header_toggle: false
        entities:
        - entity: sensor.inkbird_int_14_display_light
          name: Display brightness
        - entity: sensor.inkbird_int_14_temperature_unit
          name: Station temperature unit
    - type: markdown
      content: |
        Display brightness is writable only when the integration exposes **Display Light Command**. Station sound is shown as status; a toggle is inserted automatically when a future integration version exposes a writable sound switch.
  - type: grid
    cards:
    - type: heading
      heading: Batteries
      heading_style: title
      icon: mdi:battery-heart-variant
    - type: entities
      title: null
      show_header_toggle: false
      entities:
      - entity: sensor.overig_inkbird_int_14_base_battery
        name: Base station
      - entity: sensor.overig_inkbird_int_14_probe_1_battery
        name: Probe 1
      - entity: sensor.overig_inkbird_int_14_probe_2_battery
        name: Probe 2
      - entity: sensor.overig_inkbird_int_14_probe_3_battery
        name: Probe 3
      - entity: sensor.overig_inkbird_int_14_probe_4_battery
        name: Probe 4
      - entity: sensor.inkbird_int_14_battery_report_quality
        name: Report quality
      - entity: sensor.inkbird_int_14_battery_data_age
        name: Data age
      - entity: sensor.inkbird_int_14_last_battery_transport
        name: Source
  - type: grid
    cards:
    - type: heading
      heading: Dashboard preferences
      heading_style: title
      icon: mdi:palette
    - type: entities
      title: null
      show_header_toggle: false
      entities:
      - entity: input_select.bbq_style
        name: Card style
      - entity: input_select.bbq_accent
        name: Accent colour
      - entity: input_select.inkbird_unit
        name: Display unit
      - entity: input_number.bbq_graph_max
        name: Graph top temperature
      - entity: input_select.inkbird_active_probe
        name: Active probe
      - entity: input_boolean.bbq_show_help
        name: Show diagnostics
  - type: grid
    cards:
    - type: heading
      heading: Alerts and announcements
      heading_style: title
      icon: mdi:bell-alert
    - type: entities
      title: null
      show_header_toggle: false
      entities:
      - entity: input_boolean.bbq_battery_alerts
        name: Low battery alerts
      - entity: input_number.bbq_battery_threshold
        name: Battery threshold
      - entity: input_boolean.bbq_stall_alerts
        name: Stall alerts
      - entity: input_number.bbq_snooze_minutes
        name: Snooze duration
      - entity: input_text.bbq_notify_service
        name: Notify service
      - entity: input_boolean.bbq_tts_alerts
        name: Spoken announcements
      - entity: input_select.bbq_tts_speaker
        name: Speaker
      - entity: input_select.bbq_tts_engine
        name: TTS engine
    - type: horizontal-stack
      cards:
      - type: button
        name: Test notification
        icon: mdi:bell-check-outline
        tap_action:
          action: perform-action
          perform_action: script.bbq_notify
          data:
            title: BBQ test
            message: Notifications are working.
            tag: inkbird_test
            tts_message: This is a test announcement from your barbecue dashboard.
      - type: button
        name: Refresh devices
        icon: mdi:refresh
        tap_action:
          action: perform-action
          perform_action: script.bbq_refresh_media_targets
  - type: grid
    cards:
    - type: conditional
      conditions:
      - condition: state
        entity: input_boolean.bbq_show_help
        state: 'on'
      card:
        type: vertical-stack
        cards:
        - type: heading
          heading: Advanced diagnostics
          heading_style: title
          icon: mdi:stethoscope
        - type: entities
          title: null
          show_header_toggle: false
          entities:
          - entity: update.inkbird_int_update
            name: Integration update
          - entity: sensor.inkbird_int_14_configured_model_profile
            name: Model profile
          - entity: sensor.inkbird_int_14_expected_temperature_channel_count
            name: Expected channels
          - entity: sensor.inkbird_int_14_probe_layout
            name: Probe layout
          - entity: sensor.inkbird_int_14_last_parsed_transport
            name: Last parsed transport
          - entity: sensor.inkbird_int_14_local_lan_last_error
            name: LAN error
          - entity: sensor.inkbird_int_14_last_ble_error
            name: BLE error
          - entity: sensor.overig_inkbird_int_14_ble_diagnostic_status
            name: Last BLE diagnostic
        - type: button
          entity: button.overig_inkbird_int_14_capture_ble_diagnostics
          name: Run BLE diagnostic
          icon: mdi:play-circle-outline
  - type: grid
    cards:
    - type: heading
      heading: Setup and credits
      heading_style: title
      icon: mdi:wrench-outline
    - type: entities
      title: null
      show_header_toggle: false
      entities:
      - entity: input_text.inkbird_sensor_prefix
        name: Sensor prefix
    - type: markdown
      content: |
        - Integration: [zampix1/ha-inkbird-int14](https://github.com/zampix1/ha-inkbird-int14)
        - INT-14-BW integration and original Cook Control foundation: [boris327/ha-inkbird-int14bw](https://github.com/boris327/ha-inkbird-int14bw)
        - Dashboard: [remb0/inkbird-dashboard](https://github.com/remb0/inkbird-dashboard)
        - Multi-sensor probe layout adapted from the [INT-12E-BW community dashboard](https://github.com/zampix1/ha-inkbird-int14/blob/main/docs/int12e_dashboard.md)
