                style="display:inline-flex;align-items:center;gap:8px;background:rgba(130,145,138,.10);
                border:1px solid rgba(180,195,187,.18);padding:8px 13px;border-radius:999px;font-size:.82rem;color:var(--secondary-text-color)">
                <span style="width:8px;height:8px;border-radius:50%;background:${col};${pulse}"></span>
                ${word} \u00b7 <b style="color:var(--primary-text-color)">${how}</b></span>
              <span style="background:rgba(130,145,138,.10);border:1px solid rgba(180,195,187,.18);padding:8px 13px;
                border-radius:999px;font-size:.82rem;color:var(--secondary-text-color)">Base battery
                <b style="color:${suspect?'#d3a94d':'var(--primary-text-color)'}">${b}${suspect?'*':''}</b></span>
              <span title="Station sound status; write control appears when supported by the integration"
                style="background:rgba(130,145,138,.10);border:1px solid rgba(180,195,187,.18);padding:8px 11px;border-radius:999px;font-size:.82rem;color:var(--primary-text-color)">${sound}</span>
            </div>`;
          ]]]
    - type: conditional
      conditions:
      - condition: state
