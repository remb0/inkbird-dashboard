button_card_templates:
  inkbird_probe:
    triggers_update: all
    entity: '[[[ return "input_number.inkbird_target_" + variables.num ]]]'
    show_name: false
    show_icon: false
    show_label: false
    tap_action:
      action: more-info
    styles:
      card:
      - padding: 18px
      - border-radius: 22px
      - border: |
          [[[
            var _s = states['input_select.bbq_style'];
            var glass = _s && _s.state === 'Transparent';
            return glass ? '1px solid rgba(180,195,187,.18)' : '1px solid var(--divider-color)';
          ]]]
      - border-top: |
          [[[
            var n = variables.num, ch = variables.chan || 'food_1';
            var _p = states['input_text.inkbird_sensor_prefix'];
            _p = _p ? _p.state : '';
            var pfx = (_p && _p !== 'unknown' && _p !== 'unavailable') ? _p : variables.prefix;
            var eProbe  = 'sensor.bbq_probe_' + n + '_control_temperature';
            var eBatt   = pfx + '_probe_' + n + '_battery';
            var eTarget = 'input_number.inkbird_target_' + n;
            var eName   = 'input_text.inkbird_name_' + n;
            var eState  = 'sensor.bbq_probe_' + n + '_status';
            var eRate   = 'sensor.bbq_probe_' + n + '_rate';
            var _g = function(e){ var o = states[e]; return o ? o.state : undefined; };
            var s = _g(eState) || 'idle';
            var col = s==='ready' ? '#238458' : s==='close' ? '#b85a27' : s==='heating' ? '#946e16' : '#88988d';
            return '3px solid ' + col;
          ]]]
      - background: |
          [[[
            var _s = states['input_select.bbq_style'];
            var glass = _s && _s.state === 'Transparent';
            return glass ? 'rgba(130,145,138,.08)' : 'var(--ha-card-background, var(--card-background-color))';
          ]]]
      - box-shadow: none
      - backdrop-filter: |
          [[[
            var _s = states['input_select.bbq_style'];
            var glass = _s && _s.state === 'Transparent';
            return glass ? 'blur(12px)' : 'none';
          ]]]
      grid:
      - grid-template-areas: '"header header header header" "fig gauge side side" "spark spark spark spark"'
      - grid-template-columns: 34px 128px 1fr 1fr
      - grid-template-rows: auto 1fr 66px
      - gap: 10px 12px
      - align-items: center
      - position: relative
      custom_fields:
        header:
        - justify-self: stretch
        - position: relative
        - z-index: '1'
        fig:
        - align-self: stretch
        - position: relative
        - z-index: '1'
        gauge:
        - position: relative
        - z-index: '1'
        side:
        - justify-self: stretch
        - align-self: start
        - position: relative
        - z-index: '1'
        spark:
        - align-self: stretch
        - justify-self: stretch
        - pointer-events: none
        - opacity: '0.6'
        - overflow: hidden
    custom_fields:
      header: |
        [[[
          var n = variables.num, ch = variables.chan || 'food_1';
          var _p = states['input_text.inkbird_sensor_prefix'];
          _p = _p ? _p.state : '';
          var pfx = (_p && _p !== 'unknown' && _p !== 'unavailable') ? _p : variables.prefix;
          var eProbe  = 'sensor.bbq_probe_' + n + '_control_temperature';
          var eBatt   = pfx + '_probe_' + n + '_battery';
          var eTarget = 'input_number.inkbird_target_' + n;
          var eName   = 'input_text.inkbird_name_' + n;
          var eState  = 'sensor.bbq_probe_' + n + '_status';
          var eRate   = 'sensor.bbq_probe_' + n + '_rate';
          var _g = function(e){ var o = states[e]; return o ? o.state : undefined; };
          var s = _g(eState) || 'idle';
          var col = s==='ready' ? '#238458' : s==='close' ? '#b85a27' : s==='heating' ? '#946e16' : '#88988d';
          var name = _g(eName);
          var label = s==='ready' ? 'Ready' : s==='close' ? 'Almost there' : s==='heating' ? 'Heating' : 'Not connected';
          var bv = parseInt(_g(eBatt));
          var bok = !isNaN(bv);
          var bcol = !bok ? '#88988d' : bv < 20 ? '#b8453d' : bv < 40 ? '#946e16' : '#238458';
          return `<div style="display:flex;align-items:center;gap:11px;font-family:system-ui">
            <div style="display:flex;flex-direction:column;align-items:center;gap:3px"
                 title="probe ${n} battery">
              <div style="width:30px;height:30px;border-radius:999px;display:grid;place-items:center;
                   font-family:ui-monospace,monospace;font-weight:700;background:rgba(142,171,151,.18);
                   border:1px solid rgba(180,195,187,.18);color:var(--primary-text-color)">P${n}</div>
              <div style="font-family:ui-monospace,monospace;font-size:.62rem;font-weight:700;
                   line-height:1;color:${bcol}">${bok?bv+'%':'\u2014'}</div>
            </div>
            <div style="flex:1;font-weight:620;font-size:1rem;color:var(--primary-text-color)">${name}
              <div style="font-size:.74rem;color:var(--secondary-text-color);font-weight:500">Probe ${n}</div></div>
            <div style="font-size:.72rem;font-weight:600;letter-spacing:.04em;text-transform:uppercase;
                 padding:5px 11px;border-radius:999px;color:${col};
                 background:${col}26;border:1px solid ${col}66">${label}</div>
          </div>`;
        ]]]
      fig: |
        [[[
          var n = variables.num, ch = variables.chan || 'food_1';
          var _p = states['input_text.inkbird_sensor_prefix'];
          _p = _p ? _p.state : '';
          var pfx = (_p && _p !== 'unknown' && _p !== 'unavailable') ? _p : variables.prefix;
          var eProbe  = 'sensor.bbq_probe_' + n + '_control_temperature';
          var eBatt   = pfx + '_probe_' + n + '_battery';
          var eTarget = 'input_number.inkbird_target_' + n;
          var eName   = 'input_text.inkbird_name_' + n;
          var eState  = 'sensor.bbq_probe_' + n + '_status';
          var eRate   = 'sensor.bbq_probe_' + n + '_rate';
          var _g = function(e){ var o = states[e]; return o ? o.state : undefined; };
          var s = _g(eState) || 'idle';
          var col = s==='ready' ? '#238458' : s==='close' ? '#b85a27' : s==='heating' ? '#946e16' : '#88988d';
          var connected = s !== 'idle';
          var tip = connected ? col : '#88988d';
          var glow = connected ? `filter:drop-shadow(0 0 4px ${col})` : '';
          return `<svg viewBox="0 0 26 150" style="height:148px;width:auto;display:block;margin:auto">
            <defs>
              <linearGradient id="st${n}" x1="0" x2="1" y1="0" y2="0">
                <stop offset="0" stop-color="#6c7075"/><stop offset=".28" stop-color="#eef1f3"/>
                <stop offset=".5" stop-color="#c4c9ce"/><stop offset=".72" stop-color="#eef1f3"/>
                <stop offset="1" stop-color="#5c6065"/></linearGradient>
              <linearGradient id="gl${n}" x1="0" x2="1" y1="0" y2="0">
                <stop offset="0" stop-color="#0c0c0e"/><stop offset=".3" stop-color="#3a3a40"/>
                <stop offset=".5" stop-color="#141418"/><stop offset=".75" stop-color="#2a2a30"/>
                <stop offset="1" stop-color="#050506"/></linearGradient>
              <linearGradient id="rg${n}" x1="0" x2="1" y1="0" y2="0">
                <stop offset="0" stop-color="#8a8e93"/><stop offset=".5" stop-color="#f2f4f6"/>
                <stop offset="1" stop-color="#7a7e83"/></linearGradient>
            </defs>
            <ellipse cx="13" cy="6" rx="7.5" ry="2.6" fill="url(#rg${n})"/>
            <path d="M5.5 6 L20.5 6 L17 52 L9 52 Z" fill="url(#gl${n})" stroke="#000" stroke-width=".6"/>
            <text x="13" y="30" text-anchor="middle" font-family="ui-monospace,monospace"
                  font-weight="700" font-size="10" fill="${connected?'#f0f0f2':'#8a8a8c'}">${n}</text>
            <rect x="8.5" y="52" width="9" height="4" rx="1" fill="url(#rg${n})"/>
            <rect x="10" y="56" width="6" height="82" fill="url(#st${n})"/>
            <path d="M10 138 L16 138 L13 150 Z" fill="${tip}" style="${glow}"/>
          </svg>`;
        ]]]
      gauge: |
        [[[
          var n = variables.num, ch = variables.chan || 'food_1';
          var _p = states['input_text.inkbird_sensor_prefix'];
          _p = _p ? _p.state : '';
          var pfx = (_p && _p !== 'unknown' && _p !== 'unavailable') ? _p : variables.prefix;
          var eTarget = 'input_number.inkbird_target_' + n;
          var eState  = 'sensor.bbq_probe_' + n + '_status';
          var _g = function(e){ var o = states[e]; return o ? o.state : undefined; };
          var choice = _g('input_select.inkbird_dashboard_model') || 'Auto';
          var profile = _g('sensor.inkbird_int_14_configured_model_profile') || '';
          var model = _g('sensor.inkbird_int_14_configured_model') || '';
          var bw = choice === 'INT-14-BW' || (choice === 'Auto' && (profile === 'int14_bw' || (model.includes('14-BW') && !model.includes('14S'))));
          var eCtrl   = 'sensor.bbq_probe_' + n + '_control_temperature';
          var eDirect = pfx + '_probe_' + n + '_' + (bw ? 'internal' : 'food_4') + '_temperature';
          var eAlt    = pfx + '_probe_' + n + '_' + (bw ? 'internal' : 'food_1') + '_temperature';
          var _gVal = function(e){ var o = states[e]; return (o && o.state !== 'unknown' && o.state !== 'unavailable' && o.state !== '') ? parseFloat(o.state) : NaN; };
          var t = _gVal(eCtrl);
          if (isNaN(t)) t = _gVal(eDirect);
          if (isNaN(t)) t = _gVal(eAlt);
          var s = _g(eState) || 'idle';
          var col = s==='ready' ? '#238458' : s==='close' ? '#b85a27' : s==='heating' ? '#946e16' : '#88988d';
          var g = parseFloat(_g(eTarget));
          var amb = 22, connected = !isNaN(t);
          var pct = !connected || !Number.isFinite(g) ? 0
            : g <= amb ? (t >= g ? 1 : 0)
            : Math.max(0, Math.min(1,(t-amb)/(g-amb)));
          var R=52, C=2*Math.PI*R, ARC=0.75;
          var dash=(C*ARC*pct).toFixed(1)+' '+C;
          var uf = (_g('input_select.inkbird_unit')||'').indexOf('F') >= 0;
          var us = uf ? '\u00b0F' : '\u00b0C';
          var cv = function(c){ return uf ? Math.round(c*9/5+32) : Math.round(c*10)/10; };
          var temp = connected ? cv(t) : '\u2014';
          return `<div style="position:relative;width:128px;height:128px;margin:auto">
            <svg width="128" height="128" viewBox="0 0 128 128" style="transform:rotate(135deg)">
              <circle cx="64" cy="64" r="${R}" fill="none" stroke="var(--divider-color)" stroke-width="9"
                stroke-linecap="round" stroke-dasharray="${(C*ARC).toFixed(1)} ${C}"/>
              <circle cx="64" cy="64" r="${R}" fill="none" stroke="${col}" stroke-width="9"
                stroke-linecap="round" stroke-dasharray="${dash}"
                style="transition:stroke-dasharray .6s ease,stroke .4s"/>
            </svg>
            <div style="position:absolute;inset:0;display:flex;flex-direction:column;
                 align-items:center;justify-content:center;font-family:ui-monospace,monospace">
              <div style="font-size:1.7rem;font-weight:650;color:var(--primary-text-color);line-height:1">${temp}<span style="font-size:.9rem;color:var(--secondary-text-color)">${us}</span></div>
              <div style="font-size:.72rem;color:var(--secondary-text-color);margin-top:2px">${connected?'target '+cv(g)+'\u00b0':'no probe'}</div>
            </div>
          </div>`;
        ]]]
      side: |
        [[[
          var n = variables.num, ch = variables.chan || 'food_1';
          var _p = states['input_text.inkbird_sensor_prefix'];
          _p = _p ? _p.state : '';
          var pfx = (_p && _p !== 'unknown' && _p !== 'unavailable') ? _p : variables.prefix;
          var eTarget = 'input_number.inkbird_target_' + n;
          var eState  = 'sensor.bbq_probe_' + n + '_status';
          var eRate   = 'sensor.bbq_probe_' + n + '_rate';
          var _g = function(e){ var o = states[e]; return o ? o.state : undefined; };
          var choice = _g('input_select.inkbird_dashboard_model') || 'Auto';
          var profile = _g('sensor.inkbird_int_14_configured_model_profile') || '';
          var model = _g('sensor.inkbird_int_14_configured_model') || '';
          var bw = choice === 'INT-14-BW' || (choice === 'Auto' && (profile === 'int14_bw' || (model.includes('14-BW') && !model.includes('14S'))));
          var eCtrl   = 'sensor.bbq_probe_' + n + '_control_temperature';
          var eDirect = pfx + '_probe_' + n + '_' + (bw ? 'internal' : 'food_4') + '_temperature';
          var eAlt    = pfx + '_probe_' + n + '_' + (bw ? 'internal' : 'food_1') + '_temperature';
          var _gVal = function(e){ var o = states[e]; return (o && o.state !== 'unknown' && o.state !== 'unavailable' && o.state !== '') ? parseFloat(o.state) : NaN; };
          var t = _gVal(eCtrl);
          if (isNaN(t)) t = _gVal(eDirect);
          if (isNaN(t)) t = _gVal(eAlt);
          var s = _g(eState) || 'idle';
          var col = s==='ready' ? '#238458' : s==='close' ? '#b85a27' : s==='heating' ? '#946e16' : '#88988d';
          var g = parseFloat(_g(eTarget));
          var connected = !isNaN(t);
          var uf = (_g('input_select.inkbird_unit')||'').indexOf('F') >= 0;
          var us = uf ? '\u00b0F' : '\u00b0C';
          var cv = function(c){ return uf ? Math.round(c*9/5+32) : Math.round(c*10)/10; };
          var togo = uf ? Math.round((g-t)*9/5) : Math.round((g-t)*10)/10;
          var footer = !connected ? 'Insert a probe to begin'
            : (s==='ready' ? 'Reached target \u2014 resting'
            : Math.max(0, togo) + '\u00b0 to go');
          var rate = parseFloat(_g(eRate));
          var eta = '';
          if (connected && s !== 'ready' && !isNaN(rate) && rate > 0.5 && g > t) {
            var mins = Math.round((g - t) / rate * 60);
            if (mins > 0 && mins <= 1440) {
              var hh = Math.floor(mins/60), mm = mins % 60;
              eta = hh ? ('\u2248 ' + hh + ' h ' + mm + ' m') : ('\u2248 ' + mm + ' m');
            }
          }
          var primary = bw ? 'Internal' : 'Food 4 · tip';
          var trend = isNaN(rate) ? '\u2014' : ((rate > .15 ? '\u2197 +' : rate < -.15 ? '\u2198 ' : '\u2192 ') + rate.toFixed(1) + ' \u00b0C/h');
          return `<div style="display:flex;flex-direction:column;gap:9px;font-family:system-ui">
            <div style="font-size:.78rem;color:var(--secondary-text-color)">${footer}</div>
            <div style="display:flex;gap:10px;align-items:center;font-size:.72rem;color:var(--secondary-text-color)"><span>${primary}</span><span style="font-family:ui-monospace,monospace;color:${col}">${trend}</span></div>
            ${eta ? `<div style="font-family:ui-monospace,monospace;font-size:.74rem;color:${col}">${eta}</div>` : ''}
          </div>`;
        ]]]
      spark:
        card:
          type: custom:mini-graph-card
          entities:
          - entity: '[[[ return "sensor.bbq_probe_" + variables.num + "_control_temperature" ]]]'
            name: Temperature trend
          hours_to_show: 2
          points_per_hour: 60
          height: 60
          line_width: 3
          lower_bound: 0
          upper_bound: "[[[ var v = parseFloat((states['input_number.bbq_graph_max']||{}).state); return isNaN(v) ? 150 : v; ]]]"
          line_color: |
            [[[
              var _ac = states['input_select.bbq_accent'];
              var _A = {Ember:'#b85a27',Blue:'#2f7ce0',Green:'#34b56a',Purple:'#8a5cf0',Red:'#e0483a',Teal:'#1fb6b0'};
              return _A[_ac ? _ac.state : 'Ember'] || _A.Ember;
            ]]]
          show:
            name: false
            icon: false
            state: false
            legend: false
            labels: false
            points: false
            fill: fade
          card_mod:
            style: |
              ha-card {
                background: transparent !important;
                border: 0 !important;
                box-shadow: none !important;
                padding: 0 !important;
              }
  inkbird_recipe:
    template: inkbird_recipe_style
    tap_action:
      action: call-service
      service: script.inkbird_apply_recipe
      data:
        label: '[[[ return variables.rname ]]]'
        target: '[[[ return variables.temp ]]]'
  inkbird_recipe_style:
    show_icon: true
    styles:
      card:
      - padding: 14px
      - border-radius: 22px
      - border: |
          [[[
            var _s = states['input_select.bbq_style'];
            var glass = _s && _s.state === 'Transparent';
            return glass ? '1px solid rgba(180,195,187,.18)' : '1px solid var(--divider-color)';
          ]]]
      - background: |
          [[[
            var _s = states['input_select.bbq_style'];
            var glass = _s && _s.state === 'Transparent';
            return glass ? 'rgba(130,145,138,.08)' : 'var(--ha-card-background, var(--card-background-color))';
          ]]]
      - backdrop-filter: |
          [[[
            var _s = states['input_select.bbq_style'];
            var glass = _s && _s.state === 'Transparent';
            return glass ? 'blur(12px)' : 'none';
          ]]]
      grid:
      - grid-template-areas: '"i" "n" "t" "s"'
      - grid-template-rows: auto auto auto auto
      - gap: 6px
      - justify-items: start
      icon:
      - color: '[[[ return variables.color ]]]'
      - width: 30px
      name:
      - color: var(--primary-text-color)
      - font-weight: 620
      - font-size: .92rem
      - justify-self: start
      custom_fields:
        t:
        - justify-self: start
        s:
        - justify-self: start
    custom_fields:
      t: |
        [[[
          var _ac = states['input_select.bbq_accent'];
          var _A = {Ember:['#b85a27','#ff8a3d'],Blue:['#2f7ce0','#4f98f0'],Green:['#34b56a','#4fd188'],Purple:['#8a5cf0','#a67cff'],Red:['#e0483a','#f26a5c'],Teal:['#1fb6b0','#3fd0ca']};
          var acc = _A[_ac ? _ac.state : 'Ember'] || _A.Ember;
          var u = states['input_select.inkbird_unit'];
          var uf = u ? u.state.indexOf('F') >= 0 : false;
          var us = uf ? '\u00b0F' : '\u00b0C';
          var c = variables.temp;
          if (variables.rname === 'Custom') {
            var o = states['input_number.bbq_custom_target'];
            c = o ? parseFloat(o.state) : NaN;
            if (isNaN(c) || c <= 0) {
              return `<div style="font-family:ui-monospace,monospace;font-weight:650;font-size:1.15rem;color:var(--secondary-text-color)">\u2014</div>`;
            }
          }
          var v = uf ? Math.round(c * 9/5 + 32) : Math.round(c);
          return `<div style="font-family:ui-monospace,monospace;font-weight:650;font-size:1.15rem;color:${acc[0]}">${v}<span style="font-size:.74rem;color:var(--secondary-text-color)">${us}</span></div>`;
        ]]]
      s: |
        [[[ return `<div style="font-size:.74rem;color:var(--secondary-text-color)">${variables.note}</div>`; ]]]
title: Cook Control
views:
- title: Cook Control
  path: cook
  icon: mdi:grill
  type: sections
  max_columns: 3
  sections:
  - type: grid
    column_span: 3
    cards:
    - type: custom:button-card
      tap_action:
        action: none
      styles:
        card:
        - background: rgba(142,171,151,.18)
        - border: 1px solid rgba(180,195,187,.18)
        - backdrop-filter: blur(12px)
        - border-radius: 22px
        - box-shadow: none
        - padding: 24px
        grid:
        - grid-template-areas: '"mark title" "status status"'
        - grid-template-columns: auto minmax(0, 1fr)
        - grid-template-rows: auto auto
        - align-items: center
        - gap: 12px 14px
        custom_fields:
          title:
          - justify-self: start
          - min-width: 0
          status:
          - justify-self: stretch
          - width: 100%
      custom_fields:
        mark: |
          [[[
            var _ac = states['input_select.bbq_accent'];
            var _A = {Ember:['#b85a27','#ff8a3d'],Blue:['#2f7ce0','#4f98f0'],Green:['#34b56a','#4fd188'],Purple:['#8a5cf0','#a67cff'],Red:['#e0483a','#f26a5c'],Teal:['#1fb6b0','#3fd0ca']};
            var acc = _A[_ac ? _ac.state : 'Ember'] || _A.Ember;
            return `<div style="width:46px;height:46px;border-radius:13px;
            display:grid;place-items:center;
            background:rgba(142,171,151,.24)">
            <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="var(--primary-text-color)"
              stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round">
              <path d="M12 3c1.5 2.5.5 4-.7 5.4C10 10 9 11.4 9 13.2A3 3 0 0 0 15 13.2c0-1.2-.5-2-1-2.8"/>
              <path d="M12 21a5 5 0 0 0 5-5c0-1.6-.7-2.7-1.5-3.7"/></svg></div>`;
          ]]]
        title: |
          [[[
            var ms = states['sensor.inkbird_int_14_configured_model'];
            var choice = states['input_select.inkbird_dashboard_model'];
            var model = choice && choice.state !== 'Auto' ? choice.state : (ms && !['unknown','unavailable'].includes(ms.state) ? ms.state.replace(/^Inkbird /,'') : 'Inkbird INT');
            var active = [1,2,3,4].filter(n => { var s=states['sensor.bbq_probe_'+n+'_control_temperature']; return s && !['unknown','unavailable'].includes(s.state); }).length;
            return `<div style="font-family:system-ui;text-align:left">
            <div style="font-size:1.55rem;font-weight:650;color:var(--primary-text-color);letter-spacing:-.03em">Cook Control</div>
            <div style="font-size:.85rem;color:var(--secondary-text-color);margin-top:4px">${model} · ${active}/4 probes active</div>
          </div>`; ]]]
        status: |
          [[[
            var tr = states['sensor.inkbird_int_14_active_transport'];
            var bc = states['binary_sensor.inkbird_int_14_ble_connected'];
            var t  = tr ? tr.state : 'unknown';
            var map = {
              ble:        ['Bluetooth', 'live'],
              ble_waiting:['Bluetooth', 'wait'],
              wifi:       ['Wi-Fi',     'live'],
              wi_fi:      ['Wi-Fi',     'live'],
              local_lan:  ['LAN',       'live'],
              lan:        ['LAN',       'live'],
              cloud:      ['History',   'history'],
              none:       ['no link',   'down'],
              unknown:    ['no link',   'down'],
              unavailable:['no link',   'down']
            };
            var m = map[t] || [t.replace(/_/g,' '), 'live'];
            var how = m[0], mode = m[1];
            if (mode === 'live' && t.indexOf('ble') === 0 && !(bc && bc.state === 'on')) mode = 'wait';
            var col  = mode === 'live' ? '#238458' : mode === 'history' ? '#4f98f0' : mode === 'wait' ? '#946e16' : '#b8453d';
            var word = mode === 'live' ? 'Live' : mode === 'history' ? 'History' : mode === 'wait' ? 'Connecting' : 'Offline';
            var pulse = mode === 'wait' ? 'animation:inkbird-pulse 1.4s ease-in-out infinite' : '';
